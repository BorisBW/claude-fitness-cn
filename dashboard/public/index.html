<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Coach Paddy Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
  :root { --bg: #050505; --ink: #EDEDED; --mu: #8A8A8A; --dim: #5E5E5E; --line: #1C1C1C; --or: #FF5A36; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 56px; }
  body { background: var(--bg); color: var(--ink); font: 300 14px/1.5 "Manrope", "Noto Sans SC", "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 50px 72px; display: flex; flex-direction: column; gap: 44px; }
  .zh { font-family: "Noto Sans SC", "PingFang SC", sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .cap { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--mu); font-weight: 400; }
  .num { font-weight: 200; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .note { font-family: "Noto Sans SC", sans-serif; font-size: 12px; color: var(--mu); line-height: 1.6; }
  .sec { display: flex; flex-direction: column; gap: 28px; padding-top: 44px; border-top: 1px solid var(--line); }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .h2 { font-family: "Noto Sans SC", sans-serif; font-size: 20px; font-weight: 400; letter-spacing: .04em; }
  .row { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 40px; }
  .cell { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s9 { grid-column: span 9; } .s12 { grid-column: span 12; }
  .tr { display: grid; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  header .top { display: flex; justify-content: space-between; align-items: center; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #3A3A3A; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; }
  nav { position: sticky; top: 0; z-index: 10; background: rgba(5,5,5,.92); backdrop-filter: blur(8px); display: flex; gap: 26px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 18px -50px 0; padding: 0 50px; scrollbar-width: none; }
  nav a { font-family: "Noto Sans SC", sans-serif; font-size: 13px; color: var(--mu); text-decoration: none; padding: 12px 0; border-bottom: 1px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  nav a.on { color: var(--ink); border-bottom-color: var(--or); }
  .kpis { display: grid; grid-template-columns: repeat(4, auto); gap: 20px 36px; padding-bottom: 8px; }
  .ledger { overflow-x: auto; }
  .legend { display: flex; gap: 28px; flex-wrap: wrap; }
  .sw { display: inline-block; width: 16px; vertical-align: 3px; margin-right: 8px; border-top: 1.2px solid var(--ink); }
  #gate { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #gate input { background: transparent; border: 0; border-bottom: 1px solid #3A3A3A; color: var(--ink); font: 300 16px "Manrope", sans-serif; padding: 8px 4px; width: 200px; text-align: center; outline: none; }
  #gate input:focus { border-bottom-color: var(--or); }
  #gate button { background: none; border: 1px solid #3A3A3A; color: var(--ink); font: 400 12px "Manrope", sans-serif; letter-spacing: .2em; text-transform: uppercase; padding: 10px 22px; cursor: pointer; min-height: 44px; }
  #gate button:hover { border-color: var(--or); color: var(--or); }
  .hidden { display: none !important; }
  @media (max-width: 760px) {
    .wrap { padding: 20px 16px 56px; gap: 32px; }
    nav { margin: 14px -16px 0; padding: 0 16px; gap: 20px; }
    .row { grid-template-columns: 1fr; gap: 28px; }
    .s3, .s4, .s5, .s6, .s7, .s8, .s9, .s12 { grid-column: auto; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ledger svg { min-width: 760px; }
    .hero-num { font-size: 88px !important; }
  }
</style>
</head>
<body>
<div id="gate" class="hidden">
  <span class="cap">Coach Paddy</span>
  <input id="pass" type="password" placeholder="口令" autocomplete="off" aria-label="口令">
  <button id="enter" type="button">进入</button>
</div>
<div class="wrap hidden" id="app"></div>

<script>
const OR = '#FF5A36', INK = '#EDEDED', MU = '#8A8A8A', DIM = '#5E5E5E', LINE = '#1C1C1C';
const f1 = (n) => Number(n).toFixed(1);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const day = (iso) => new Date(iso + 'T00:00:00');
const daysBetween = (a, b) => Math.round((day(b) - day(a)) / 86400000);
const md = (iso) => { const d = day(iso); return (d.getMonth() + 1) + '/' + d.getDate(); };
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;
const sd = (a) => { const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
const path = (pts) => pts.map((p, i) => (i ? 'L ' : 'M ') + f1(p[0]) + ' ' + f1(p[1])).join(' ');

// One week = one row; every run is a Gaussian pulse. Logged rows keep a faint tremor (real signal), plans are clean.
function pulseRow(days, r, x0, x1, base, ampK, tremor, N) {
  const m = (x1 - x0) * 0.12, dw = (x1 - x0 - 2 * m) / 7, amax = 42 * ampK;
  let line = '';
  for (let i = 0; i <= N; i++) {
    const x = x0 + (x1 - x0) * i / N;
    let h = 0;
    days.forEach((km, d) => { if (!km) return; const xc = x0 + m + (d + 0.5) * dw, s = dw * (0.16 + 0.16 * Math.sqrt(km / 10)); h += km * ampK * Math.exp(-Math.pow((x - xc) / s, 2)); });
    const u = Math.min(i, N - i) / N, edge = u < 0.04 ? 0 : Math.min(1, (u - 0.04) / 0.1);
    const n = (Math.sin(i * 1.9 + r * 3.7) * 0.55 + Math.sin(i * 5.3 + r * 1.1) * 0.3 + Math.sin(i * 11.7 + r * 0.7) * 0.15) * tremor * edge * (0.35 + 1.6 * h / amax);
    line += (i ? ' L ' : 'M ') + f1(x) + ' ' + f1(base - h - n);
  }
  return { line, fill: line + ' L ' + f1(x1) + ' ' + f1(base + 2) + ' L ' + f1(x0) + ' ' + f1(base + 2) + ' Z' };
}

function sec(id, title, sub, inner) {
  return `<section id="${id}" class="sec"><div class="sec-head"><h2 class="h2">${title}</h2><span class="note">${sub}</span></div>${inner}</section>`;
}
const svg = (vb, label, inner) => `<svg viewBox="${vb}" role="img" aria-label="${esc(label)}">${inner}</svg>`;

// ---------------- sections ----------------
function header(d) {
  const nav = [['overview', '总览'], ['macro', '大周期'], ['races', '比赛'], ['running', '跑步'], ['strength', '力量'], ['recovery', '恢复'], ['physio', '生理'], ['rehab', '康复'], ['diet', '营养']];
  const t = day(d.pulse.today);
  return `<header>
    <div class="top">
      <div style="display:flex;align-items:center;gap:14px"><div class="avatar">${esc((d.athlete?.name || 'C').charAt(0).toUpperCase())}</div><div style="display:flex;flex-direction:column"><span style="font-size:14px;font-weight:500">${esc(d.athlete?.name || 'Athlete')} · Coach Paddy</span><span class="cap" style="letter-spacing:.14em">${esc(d.phase)}</span></div></div>
      <div style="display:flex;align-items:center;gap:10px"><span style="width:6px;height:6px;border-radius:50%;background:${OR}"></span><span class="cap">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][t.getDay()]} · ${t.getDate()} ${MONTHS[t.getMonth()].charAt(0) + MONTHS[t.getMonth()].slice(1).toLowerCase()} ${t.getFullYear()}</span></div>
    </div>
    <nav id="nav">${nav.map(([id, n], i) => `<a href="#${id}" class="${i ? '' : 'on'}">${n}</a>`).join('')}</nav>
  </header>`;
}

function overview(d) {
  const today = d.pulse.today, osaka = d.races.upcoming.find((r) => r.date === d.macro?.race) || d.races.upcoming.find((r) => /^A/.test(r.tag || '')) || d.races.upcoming.at(-1);
  const left = daysBetween(today, osaka.date);
  const now = d.pulse.rows.find((r) => r.kind === 'now'), last = d.pulse.rows.filter((r) => r.kind === 'actual').at(-1);
  const weekKm = (r) => r ? Math.round(r.days.reduce((a, b) => a + b, 0) * 10) / 10 : 0;
  const kpis = [
    ['ACWR', d.kpi.acwr?.value ?? '—', '', 'Garmin · ' + (d.kpi.acwr?.date ? md(d.kpi.acwr.date) : ''), INK],
    ['VO₂max', d.physio.vo2max ?? d.kpi.vo2max?.value ?? '—', '', '全马预测 ' + (d.physio.predicted?.marathon ?? '—'), INK],
    ['上周', weekKm(last), 'km', '目标 ' + d.weeklyRunTarget.join('–'), OR],
    ['体重', d.weightLatest?.kg ?? '—', 'kg', d.weightLatest ? md(d.weightLatest.date) + ' · ' + (d.weight?.target ?? '') : '', INK],
  ];

  // ledger
  const rows = d.pulse.rows, x0 = 150, x1 = 910, top = 30, gap = 13.2, k = 3.3, H = top + (rows.length - 1) * gap + 50;
  const mm = (x1 - x0) * 0.12, dw = (x1 - x0 - 2 * mm) / 7, dayX = (i) => x0 + mm + (i + 0.5) * dw;
  let lastMon = -1, body = '';
  rows.forEach((r, i) => {
    const base = top + i * gap, isNow = r.kind === 'now';
    const p = pulseRow(r.days, i, x0, x1, base, k, r.kind === 'actual' ? 1.1 : 0, 300);
    const mon = day(r.mon).getMonth(), lab = isNow ? 'NOW' : mon !== lastMon ? MONTHS[mon] : ''; lastMon = mon;
    const tot = r.days.reduce((a, b) => a + b, 0), rk = r.race ? Math.max(...r.days) : 0, rest = Math.round((tot - rk) * 10) / 10, totS = r.race ? `${rest}+${Math.round(rk)}` : (Number.isInteger(tot) ? tot : tot.toFixed(1));
    const c = isNow ? OR : INK, o = isNow || r.kind === 'actual' ? 1 : r.kind === 'plan' ? .55 : .3;
    body += `<path d="${p.fill}" fill="#050505"/><path d="${p.line}" fill="none" stroke="${c}" stroke-opacity="${o}" stroke-width="${isNow ? 1.8 : 1.15}" stroke-linejoin="round"/>`;
    body += `<text x="132" y="${f1(base + 3)}" text-anchor="end" font-size="10" fill="${isNow ? OR : MU}" font-family="JetBrains Mono">${lab}</text>`;
    body += `<text x="930" y="${f1(base + 3)}" text-anchor="end" font-size="10" fill="${isNow ? OR : r.kind === 'actual' ? '#9A9A9A' : '#6E6E6E'}" font-family="JetBrains Mono">${totS}</text>`;
  });
  const nowI = rows.findIndex((r) => r.kind === 'now');
  if (nowI >= 0) body += `<circle cx="${f1(dayX((day(d.pulse.today).getDay() + 6) % 7))}" cy="${f1(top + nowI * gap)}" r="3.5" fill="${OR}"/>`;
  d.pulse.phases.forEach((ph) => {
    const idx = rows.map((r, i) => (r.mon >= ph.from && r.mon <= ph.to ? i : -1)).filter((i) => i >= 0);
    if (!idx.length) return;
    const a = idx[0], b = idx.at(-1), y0 = top + a * gap - 4, y1 = top + b * gap + 4;
    const past = rows[b].kind === 'actual', cur = idx.includes(nowI);
    const c = ph.race === 'A' ? OR : ph.race === 'B' ? INK : cur ? '#9A9A9A' : past ? '#6E6E6E' : '#4A4A4A';
    body += `<path d="M 954 ${f1(y0)} H 958 V ${f1(y1)} H 954" fill="none" stroke="${c}"/><text x="968" y="${f1((y0 + y1) / 2 + 4)}" font-size="11" fill="${c}" font-family="Noto Sans SC">${esc(ph.t)}</text>`;
  });
  ['一', '二', '三', '四', '五', '六', '日'].forEach((t, i) => { body += `<text x="${f1(dayX(i))}" y="${f1(H - 8)}" text-anchor="middle" font-size="11" fill="${DIM}" font-family="Noto Sans SC">${t}</text>`; });
  body += `<text x="930" y="${f1(H - 8)}" text-anchor="end" font-size="10" fill="${DIM}" font-family="JetBrains Mono">KM/周</text>`;

  // load mix
  const wm = d.weeklyMinutes, bw = 760 / wm.length;
  let bars = '';
  wm.forEach((w, i) => {
    const X = 10 + i * bw, isNow = i === wm.length - 1;
    bars += `<rect x="${f1(X)}" y="${f1(160 - w.run * 0.4)}" width="7" height="${f1(w.run * 0.4)}" fill="${INK}" fill-opacity="${isNow ? 1 : .6}"/><rect x="${f1(X + 9)}" y="${f1(160 - w.str * 0.4)}" width="7" height="${f1(w.str * 0.4)}" fill="${DIM}"/>`;
    if (i % 2 === 0 || isNow) bars += `<text x="${f1(X + 8)}" y="176" text-anchor="middle" font-size="9" fill="${DIM}" font-family="JetBrains Mono">${md(w.mon)}</text>`;
  });
  const lastFull = wm.at(-2) || wm.at(-1), share = Math.round(lastFull.str / Math.max(1, lastFull.run + lastFull.str) * 100);

  return `<section id="overview" style="display:flex;flex-direction:column;gap:28px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:24px">
      <div style="display:flex;flex-direction:column;gap:6px"><span class="cap">${esc(osaka.name)} · ${esc(osaka.date)} · 目标 ${esc(d.macro.target)}</span>
        <div style="display:flex;align-items:baseline;gap:12px"><span class="num hero-num" style="font-size:120px;line-height:.86">${left}</span><span class="zh" style="font-size:22px;color:${MU}">天</span></div></div>
      <div class="kpis">${kpis.map((x) => `<div style="display:flex;flex-direction:column;gap:6px"><span class="cap" style="color:${DIM}">${x[0]}</span><span class="num" style="font-size:30px;line-height:1;color:${x[4]}">${x[1]}<span style="font-size:12px;color:${MU}"> ${x[2]}</span></span><span class="zh" style="font-size:11px;color:${DIM}">${esc(x[3])}</span></div>`).join('')}</div>
    </div>
    <div class="ledger">${svg(`0 0 1120 ${f1(H)}`, '脉冲账本：每一行一周，横向周一到周日，每次跑步一个脉冲；本周为橙色；右侧为训练阶段', body)}</div>
    <div class="legend"><span class="note"><span class="sw"></span>已跑 · 日志原始信号</span><span class="note"><span class="sw" style="border-top-color:rgba(237,237,237,.55)"></span>计划 · Training Plan</span><span class="note"><span class="sw" style="border-top-color:rgba(237,237,237,.3)"></span>大周期预估</span><span class="note" style="color:${OR}"><span class="sw" style="border-top:1.6px solid ${OR}"></span>本周</span></div>
    <div class="row" style="padding-top:28px;border-top:1px solid ${LINE}">
      <div class="cell s8"><div style="display:flex;justify-content:space-between"><span class="cap">训练负荷 · 跑步 vs 力量（分钟 / 周）</span><span class="note">ACWR ${d.kpi.acwr?.value ?? '—'}</span></div>
        ${svg('0 0 780 180', '每周跑步与力量训练时长', bars + `<line x1="0" y1="160" x2="780" y2="160" stroke="${LINE}"/>`)}
        <span class="note"><span style="display:inline-block;width:8px;height:8px;background:${INK};margin-right:6px"></span>跑步　<span style="display:inline-block;width:8px;height:8px;background:${DIM};margin:0 6px 0 12px"></span>力量　·　日志缺时长时按 6:18/km、力量课 70 min 估算</span></div>
      <div class="cell s4"><span class="cap">上周负荷构成</span>
        <div style="display:flex;align-items:baseline;gap:8px"><span class="num" style="font-size:56px;line-height:1">${share}<span style="font-size:20px;color:${MU}">%</span></span><span class="note">力量</span></div>
        <div style="display:flex;height:2px"><div style="width:${100 - share}%;background:${INK}"></div><div style="width:${share}%;background:${DIM}"></div></div>
        <span class="note">跑步 ${lastFull.run} min · 力量 ${lastFull.str} min。Garmin 按心率算负荷，系统性低估力量课，所以这里用时长。</span></div>
    </div>
  </section>`;
}

function macro(d) {
  const M = d.macro, today = d.pulse.today, total = daysBetween(M.start, M.race), done = Math.max(0, Math.min(total, daysBetween(M.start, today)));
  const pct = Math.round(done / total * 100), cur = M.phases.find((p) => today >= p.start && today <= p.end) || M.phases[0];
  const PX = (iso) => daysBetween(M.start, iso) / total * 1080;
  let bar = '';
  M.phases.forEach((p) => {
    const x = PX(p.start), w = PX(p.end) - x + 1080 / total, isCur = p === cur, isPast = p.end < today;
    bar += `<rect x="${f1(x)}" y="10" width="${f1(Math.max(2, w - 3))}" height="6" fill="${isCur ? OR : isPast ? '#3A3A3A' : '#2A2A2A'}"/><text x="${f1(x)}" y="36" font-size="11" fill="${isCur ? OR : isPast ? DIM : MU}" font-family="Noto Sans SC">${esc(p.name)}</text><text x="${f1(x)}" y="52" font-size="10" fill="${DIM}" font-family="JetBrains Mono">${esc(p.km)}</text>`;
  });
  bar += `<line x1="${f1(PX(today))}" y1="0" x2="${f1(PX(today))}" y2="22" stroke="${OR}" stroke-width="1.5"/>`;

  const L0 = day(M.longRuns[0].date).getTime() - 7 * 864e5, L1 = day(M.race).getTime() + 4 * 864e5;
  const LX = (iso) => 20 + (day(iso).getTime() - L0) / (L1 - L0) * 600, LY = (km) => 180 - km * 3.6;
  let ll = 'M 0 180';
  for (let i = 0; i <= 640; i += 2) { let h = 0; M.longRuns.forEach((l) => { h += l.km * 3.6 * Math.exp(-Math.pow((i - LX(l.date)) / 5, 2)); }); ll += ' L ' + i + ' ' + f1(180 - h); }
  let lr = `<path d="${ll} L 640 182 L 0 182 Z" fill="#050505"/><path d="${ll}" fill="none" stroke="${INK}" stroke-opacity=".75" stroke-width="1.2" stroke-linejoin="round"/>`;
  M.longRuns.forEach((l) => {
    const x = LX(l.date), done = l.date <= today, isOs = l.date === M.race;
    if (l.mp) lr += `<line x1="${f1(x)}" y1="${f1(LY(l.km))}" x2="${f1(x)}" y2="${f1(LY(l.km - l.mp))}" stroke="${INK}" stroke-width="3"/>`;
    lr += `<text x="${f1(x)}" y="${f1(LY(l.km) - 8)}" text-anchor="middle" font-size="10" fill="${isOs ? OR : l.race || done ? INK : MU}" font-family="JetBrains Mono">${l.race ? '42.2' : l.mp ? l.km + '·' + l.mp : l.km}</text>`;
  });
  [[1, 'NOV'], [0, 'DEC'], [0, 'JAN'], [0, 'FEB']].forEach(() => {});
  ['2026-11-01', '2026-12-01', '2027-01-01', '2027-02-01'].forEach((iso) => { if (day(iso).getTime() > L0) lr += `<text x="${f1(LX(iso))}" y="196" text-anchor="middle" font-size="10" fill="${DIM}" font-family="Manrope" letter-spacing="1">${MONTHS[day(iso).getMonth()]}</text>`; });
  lr += `<line x1="0" y1="180" x2="640" y2="180" stroke="${LINE}"/>`;

  const ms = M.milestones.map((m) => { const isLast = m.date === M.race, past = m.date < today; return `<div class="tr" style="grid-template-columns:52px minmax(0,1fr)"><span class="mono" style="font-size:11px;color:${isLast ? OR : past ? DIM : MU}">${md(m.date)}</span><div style="display:flex;flex-direction:column;gap:2px"><span class="zh" style="font-size:13px;color:${isLast ? OR : past ? DIM : INK}">${esc(m.label.replace(/🏁\s*/, ''))}</span><span class="note" style="font-size:11px">${esc(m.note)}</span></div></div>`; }).join('');
  const st = M.strategy.map((s, i) => `<div class="cell s6" style="padding-top:14px;border-top:1px solid ${i ? OR : '#3A3A3A'}"><span class="zh" style="font-size:15px;color:${i ? OR : INK}">${esc(s.race)}</span><span class="note">${esc(s.text)}</span></div>`).join('');

  return sec('macro', `大周期 · ${esc(M.name)}`, `${md(M.start)} → ${md(M.race)} · ${Math.round(total / 7)} 周`, `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px"><div style="display:flex;flex-direction:column;gap:4px"><span class="zh" style="font-size:16px">阶段 ${cur.n} · ${esc(cur.name)}（${md(cur.start)} – ${md(cur.end)}）</span><span class="note">周跑量 ${esc(cur.km)} · 长距离 ${esc(cur.long)}${cur.strength ? ' · ' + esc(cur.strength) : ''}</span></div><div style="display:flex;flex-direction:column;align-items:flex-end"><span class="num" style="font-size:44px;line-height:1;color:${OR}">${pct}%</span><span class="note">周期进度</span></div></div>
    ${svg('0 0 1080 60', '大周期各阶段与今天的位置', bar)}
    <div class="row"><div class="cell s7"><span class="cap">长距离阶梯 · km（亮色段 = 马配）</span>${svg('0 0 640 200', '长距离阶梯', lr)}</div><div class="cell s5"><span class="cap">关键节点</span><div>${ms}</div></div></div>
    <div class="row">${st}</div>`);
}

function races(d) {
  const today = d.pulse.today;
  const rp = (n) => { let p = ''; for (let i = 0; i <= 260; i++) { const x = i / 260 * 520, h = Math.exp(-Math.pow((x - 470) / 14, 2)) * 56 + Math.exp(-Math.pow((x - 260) / 90, 2)) * 6 * n; p += (i ? ' L ' : 'M ') + f1(x) + ' ' + f1(64 - h); } return p; };
  const span = d.races.upcoming.length > 2 ? 's4' : 's6';
  const cards = d.races.upcoming.map((r) => { const a = /^A/.test(r.tag || ''), c = a ? OR : INK; return `<div class="cell ${span}" style="gap:8px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="zh" style="font-size:16px">${esc(r.name)}</span><span class="mono" style="font-size:11px;color:${a ? OR : MU}">${esc(r.tag)}</span></div>${svg('0 0 520 70', '比赛倒计时', `<path d="${rp(a ? 1 : .6)}" fill="none" stroke="${c}" stroke-width="1.3"/>`)}<div style="display:flex;align-items:baseline;gap:8px"><span class="num" style="font-size:48px;line-height:1;color:${c}">${daysBetween(today, r.date)}</span><span class="note">天 · ${md(r.date)}</span></div><span class="note">${esc(r.detail)}</span></div>`; }).join('');
  const pbs = d.pbs.map((p) => `<div class="tr" style="grid-template-columns:48px 90px 76px minmax(0,1fr)"><span class="zh" style="font-size:13px">${esc(p.dist)}</span><span class="mono" style="font-size:15px">${esc(p.time)}</span><span class="mono" style="font-size:11px;color:${MU}">${esc(p.pace)}</span><span class="note" style="font-size:11px;text-align:right">${esc(p.note || p.date.slice(0, 7))}</span></div>`).join('');
  const perf = d.goals.performance.map((g, i) => `<div class="tr" style="grid-template-columns:1fr"><span class="mono" style="font-size:11px;color:${i ? MU : OR}">${esc(g.year)}</span><span class="zh" style="font-size:13px">${esc(g.goal)}</span></div>`).join('');
  const hg = d.goals.firstPriority.map((g, i) => `<div class="tr" style="grid-template-columns:20px minmax(0,1fr)"><span class="mono" style="font-size:11px;color:${DIM}">0${i + 1}</span><span class="zh" style="font-size:13px;line-height:1.5">${esc(g)}</span></div>`).join('');
  return sec('races', '比赛', '两场全马 · PB · 目标', `<div class="row">${cards}</div>
    <div class="row"><div class="cell s5"><span class="cap">个人 PB</span><div>${pbs}</div></div><div class="cell s3"><span class="cap">表现目标</span><div>${perf}</div></div><div class="cell s4"><span class="cap">底层健康目标</span><div>${hg}</div></div></div>`);
}

function running(d) {
  const acts = d.pulse.rows.filter((r) => r.kind === 'actual');
  const it = d.intensityDist.slice(-acts.length);
  const bw = 520 / it.length; let ib = '';
  it.forEach((w, i) => { const X = 6 + i * bw; ib += `<rect x="${f1(X)}" y="${f1(140 - w.easyKm * 3.3)}" width="14" height="${f1(w.easyKm * 3.3)}" fill="${DIM}"/><rect x="${f1(X)}" y="${f1(140 - (w.easyKm + w.hardKm) * 3.3)}" width="14" height="${f1(w.hardKm * 3.3)}" fill="${INK}"/>`; if (i % 3 === 0 || i === it.length - 1) ib += `<text x="${f1(X + 7)}" y="156" text-anchor="middle" font-size="9" fill="${DIM}" font-family="JetBrains Mono">${esc(w.week.slice(5))}</text>`; });
  ib += `<line x1="0" y1="140" x2="520" y2="140" stroke="${LINE}"/>`;
  const e = it.reduce((s, w) => s + w.easyKm, 0), h = it.reduce((s, w) => s + w.hardKm, 0);

  const kw = d.keyWorkouts.slice(-12); let kp = '';
  if (kw.length) {
    const ps = kw.map((k) => k.paceSec), lo = Math.min(...ps) - 15, hi = Math.max(...ps) + 15;
    const KY = (s) => 14 + (s - lo) / (hi - lo) * 120;
    kw.forEach((k, i) => { const x = 60 + (kw.length === 1 ? 220 : i / (kw.length - 1) * 440), y = KY(k.paceSec), lab = Math.floor(k.paceSec / 60) + ':' + String(k.paceSec % 60).padStart(2, '0');
      const sh = k.type === 'Long Run' ? `<circle cx="${f1(x)}" cy="${f1(y)}" r="4" fill="#050505" stroke="${INK}" stroke-width="1.2"/>` : k.type === 'Interval' ? `<path d="M ${f1(x)} ${f1(y - 5)} L ${f1(x + 5)} ${f1(y + 4)} L ${f1(x - 5)} ${f1(y + 4)} Z" fill="${INK}"/>` : `<rect x="${f1(x - 4)}" y="${f1(y - 4)}" width="8" height="8" fill="${INK}"/>`;
      kp += sh + `<text x="${f1(x)}" y="${f1(y - 10)}" text-anchor="middle" font-size="9" fill="${MU}" font-family="JetBrains Mono">${lab}</text><text x="${f1(x)}" y="152" text-anchor="middle" font-size="9" fill="${DIM}" font-family="JetBrains Mono">${esc(k.date)}</text>`; });
  }
  const ef = d.effSeries; let ep = '', effNote = '日志里带心率和时长的 Easy 跑会在这里出现。';
  if (ef.length >= 2) {
    const E0 = day(ef[0].date).getTime(), E1 = day(ef.at(-1).date).getTime() || E0 + 1, vs = ef.map((x) => x.eff), lo = Math.min(...vs) - .02, hi = Math.max(...vs) + .02;
    const pts = ef.map((x) => [(day(x.date).getTime() - E0) / Math.max(1, E1 - E0) * 1080, 110 - (x.eff - lo) / (hi - lo) * 100]);
    const best = vs.indexOf(Math.max(...vs));
    ep = `<path d="${path(pts)}" fill="none" stroke="${INK}" stroke-opacity=".75" stroke-width="1.2" stroke-linejoin="round"/>` + pts.map((p, i) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="2.4" fill="${i === best ? OR : INK}"/>`).join('') + `<text x="${f1(pts[best][0])}" y="${f1(pts[best][1] - 10)}" text-anchor="middle" font-size="11" fill="${OR}" font-family="JetBrains Mono">${ef[best].eff} · ${md(ef[best].date)}</text>`;
    effNote = `最近 ${ef.length} 次 Easy 跑，范围 ${Math.min(...vs)}–${Math.max(...vs)}。同样心率跑得更快，说明有氧在变好。`;
  }
  return sec('running', '跑步', `近 ${acts.length} 周 · ${Math.round(e + h)} km`, `
    <div class="row"><div class="cell s6"><span class="cap">强度分布 · 80/20（km / 周）</span>${svg('0 0 520 160', '每周轻松与高强度跑量', ib)}<span class="note">灰 = 轻松 ${Math.round(e)} km，白 = 高强度 ${Math.round(h)} km，高强度占 ${Math.round(h / Math.max(1, e + h) * 100)}%。</span></div>
      <div class="cell s6"><span class="cap">关键训练配速 · 越高越快</span>${svg('0 0 520 160', '关键训练配速', kp || `<text x="0" y="80" font-size="12" fill="${DIM}" font-family="Noto Sans SC">日志里还没有带时长的长距离 / 节奏 / 间歇课</text>`)}<span class="note">○ 长距离　■ 节奏 / 阈值　▲ 间歇</span></div></div>
    <div class="cell"><div style="display:flex;justify-content:space-between"><span class="cap">心率效率 · 每分钟心跳跑多少米（Easy 跑）</span><span class="note">越高 = 同样心率跑得越快</span></div>${svg('0 0 1080 120', 'Easy 跑心率效率', ep)}<span class="note">${effNote}</span></div>`);
}

function strength(d) {
  const vl = d.strength.vlHistory.slice(0, 6).map((v, vi) => {
    const arr = v.points.map((p) => p.vl), lo = Math.min(...arr), hi = Math.max(...arr);
    const pts = arr.map((x, i) => [6 + i / Math.max(1, arr.length - 1) * 308, 62 - (x - lo) / Math.max(1, hi - lo) * 52]);
    const last = v.points.at(-1);
    return `<div class="cell s4" style="gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span class="zh" style="font-size:13px">${esc(v.name)}</span><span class="mono" style="font-size:11px;color:${vi ? MU : OR};text-align:right">${esc(last.scheme)}</span></div>${svg('0 0 320 70', 'Volume Load 变化', `<path d="${path(pts)}" fill="none" stroke="${INK}" stroke-opacity=".75" stroke-width="1.2" stroke-linejoin="round"/>` + pts.map((p, i) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="2" fill="${i === pts.length - 1 ? (vi ? INK : OR) : DIM}"/>`).join(''))}<span class="note" style="font-size:11px">${esc(v.points[0].date)} → ${esc(last.date)} · VL ${arr[0]} → ${last.vl}</span></div>`;
  }).join('');
  const tbl = (tier) => d.strength.progress.filter((p) => p.tier === tier).map((p) => `<div class="tr" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)"><span class="zh" style="font-size:13px">${esc(p.name.replace(/（.*?）/g, ''))}</span><span class="mono" style="font-size:12px;color:${MU};text-align:right">${esc(p.current.replace(/（.*?）/g, ''))}</span></div>`).join('');
  return sec('strength', '力量 · Volume Load', 'VL = 重量 × 工作组总次数 · 来源 Training Plan', `<div class="row">${vl}</div>
    <div class="row"><div class="cell s7"><span class="cap">大项</span><div>${tbl('main')}</div></div><div class="cell s5"><span class="cap">辅助</span><div>${tbl('accessory')}</div></div></div>`);
}

function recovery(d) {
  const R = d.recovery.slice(-28), n = R.length;
  const mk = (key, label, unit, band, lo, hi) => {
    const arr = R.map((r) => r[key]).filter((v) => v != null);
    if (arr.length < 2) return '';
    const y = (v) => 92 - (v - lo) / (hi - lo) * 84;
    const pts = R.map((r, i) => r[key] == null ? null : [i / (n - 1) * 520, y(r[key])]).filter(Boolean);
    const lastV = arr.at(-1), minI = arr.indexOf(key === 'rhr' ? Math.max(...arr) : Math.min(...arr));
    const b = band(arr);
    return `<div class="cell s6" style="gap:8px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="cap">${label}</span><span class="note">${b.txt}</span></div>
      <div style="display:flex;align-items:baseline;gap:6px"><span class="num" style="font-size:40px;line-height:1">${lastV}</span><span style="font-size:12px;color:${MU}">${unit}</span></div>
      ${svg('0 0 520 108', label + ' 近 28 天', `<rect x="0" y="${f1(y(b.hi))}" width="520" height="${f1(Math.max(0, y(b.lo) - y(b.hi)))}" fill="${INK}" fill-opacity=".05"/><path d="${path(pts)}" fill="none" stroke="${INK}" stroke-opacity=".75" stroke-width="1.2" stroke-linejoin="round"/><circle cx="${f1(pts[minI][0])}" cy="${f1(pts[minI][1])}" r="3" fill="#050505" stroke="${MU}"/><circle cx="${f1(pts.at(-1)[0])}" cy="${f1(pts.at(-1)[1])}" r="3.5" fill="${OR}"/><text x="0" y="104" font-size="10" fill="${DIM}" font-family="Manrope" letter-spacing="1">${md(R[0].date)}</text><text x="520" y="104" text-anchor="end" font-size="10" fill="${DIM}" font-family="Manrope" letter-spacing="1">${md(R.at(-1).date)}</text>`)}</div>`;
  };
  const swc = (a) => { const m = mean(a), s = sd(a); return { lo: m - s / 2, hi: m + s / 2, txt: `正常带 ${f1(m - s / 2)}–${f1(m + s / 2)} · μ ${f1(m)}` }; };
  const pm = (a) => { const m = mean(a), s = sd(a); return { lo: m - s, hi: m + s, txt: `均值 ${f1(m)} · 范围 ${Math.min(...a)}–${Math.max(...a)}` }; };
  const iq = (a) => { const s = [...a].sort((x, y) => x - y), q1 = s[Math.floor(s.length / 4)], q3 = s[Math.floor(s.length * 3 / 4)]; return { lo: q1, hi: q3, txt: `典型 ${q1}–${q3}` }; };
  return sec('recovery', '恢复趋势', `近 ${n} 天 · 淡色带 = 个人正常范围 · 空心点 = 最差的一天`, `<div class="row">
    ${mk('hrv', 'HRV', 'ms', swc, 20, 60)}${mk('rhr', '静息心率', 'bpm', pm, 48, 66)}${mk('sleep', '睡眠评分', '', iq, 30, 100)}${mk('readiness', 'Readiness', '/10', iq, 0, 10)}</div>`);
}

function physio(d) {
  const P = d.physio, Z = P.hrZones;
  const zones = Z.map((z, i) => `<rect x="${i * 216}" y="14" width="206" height="4" fill="${i === 1 ? INK : i === 2 ? '#9A9A9A' : '#3A3A3A'}"/><text x="${i * 216}" y="40" font-size="12" fill="${INK}" font-family="JetBrains Mono">${esc(z.zone)} · ${esc(z.bpm)}</text><text x="${i * 216}" y="58" font-size="11" fill="${MU}" font-family="Noto Sans SC">${esc(z.use)}</text>`).join('');
  const kv = (rows, w) => rows.map(([k, v]) => `<div class="tr" style="grid-template-columns:${w}px minmax(0,1fr)"><span class="zh" style="font-size:13px">${esc(k)}</span><span class="zh" style="font-size:12px;color:${MU};line-height:1.5">${esc(v)}</span></div>`).join('');
  const W = d.body.weights.slice(-8); let wch = '';
  if (W.length >= 2) {
    const vs = W.map((w) => w.kg), lo = Math.min(...vs) - .3, hi = Math.max(...vs) + .3, Y = (v) => 72 - (v - lo) / (hi - lo) * 64;
    const pts = W.map((w, i) => [6 + i / (W.length - 1) * 308, Y(w.kg)]);
    wch = `<path d="${path(pts)}" fill="none" stroke="${INK}" stroke-opacity=".75" stroke-width="1.2"/>` + pts.map((p, i) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="2.2" fill="${i === pts.length - 1 ? OR : INK}"/>`).join('');
  }
  return sec('physio', '生理数据', `${P.height} cm · ${P.age} 岁 · LTHR ${P.lthr}`, `
    <div class="cell"><span class="cap">心率区间</span>${svg('0 0 1080 64', '五个心率区间', zones)}<span class="note">Easy 配速 ${esc(P.easyPace)} · 乳酸阈配速 ${esc(P.ltPace)} · 大阪目标马配 ${esc(d.macro.targetPace)}</span></div>
    <div class="row">
      <div class="cell s4"><span class="cap">基准区间</span><div>${kv([['HRV', P.baselines.hrv], ['静息心率', P.baselines.rhr], ['睡眠评分', P.baselines.sleep], ['VO₂max', P.vo2max ?? '—']], 76)}</div></div>
      <div class="cell s4"><span class="cap">营养目标</span><div>${kv([['蛋白', P.nutrition.protein], ['热量', P.nutrition.calories + '，' + P.nutrition.deficit], ['注意', P.nutrition.notes]], 48)}</div></div>
      <div class="cell s4"><div style="display:flex;justify-content:space-between"><span class="cap">体重</span><span class="note">${esc(d.weight?.target ?? '')}</span></div>
        <div style="display:flex;align-items:baseline;gap:6px"><span class="num" style="font-size:40px;line-height:1">${d.weightLatest?.kg ?? '—'}</span><span style="font-size:12px;color:${MU}">kg · ${d.weightLatest ? md(d.weightLatest.date) : ''}</span></div>
        ${svg('0 0 320 80', '体重趋势', wch)}</div>
    </div>`);
}

function rehab(d) {
  const cards = d.injuries.map((i, k) => { const hot = k === 0; const c = hot ? OR : MU; return `<div class="cell s4" style="gap:10px;padding-top:14px;border-top:1px solid ${hot ? OR : '#3A3A3A'}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="zh" style="font-size:15px">${esc(i.name)}</span><span style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:${c}"></span><span class="zh" style="font-size:11px;color:${c}">${{ watching: '观察', treating: '处理中', resolved: '已恢复' }[i.status] || esc(i.status)}</span></span></div><span class="note">${esc(i.note)}</span>${i.test ? `<div style="display:flex;justify-content:flex-end;padding-top:8px;border-top:1px solid ${LINE}"><span class="mono" style="font-size:12px">${esc(i.test)}</span></div>` : ''}</div>`; }).join('');
  return sec('rehab', '康复 / 伤病', `${d.injuries.length} 项监控中`, `<div class="row">${cards}</div>`);
}

function diet(d) {
  const T = d.dietTarget, days = d.diet.days.slice(-7);
  const avg = (k) => days.length ? Math.round(days.reduce((s, x) => s + (x[k] || 0), 0) / days.length) : 0;
  const rows = [['热量', avg('totalKcal'), T.kcal, 'kcal'], ['蛋白', avg('totalProtein'), T.protein, 'g'], ['碳水', avg('totalCarb'), T.carb, 'g'], ['脂肪', avg('totalFat'), T.fat, 'g']];
  const ch = rows.map(([k, v, t, u], i) => { const y = 30 + i * 34, w = Math.min(1, v / t) * 530; return `<text x="0" y="${y}" font-size="12" fill="${INK}" font-family="Noto Sans SC">${k}</text><line x1="90" y1="${y - 4}" x2="620" y2="${y - 4}" stroke="${LINE}" stroke-width="2"/>${v ? `<line x1="90" y1="${y - 4}" x2="${f1(90 + w)}" y2="${y - 4}" stroke="${INK}" stroke-width="2"/>` : ''}<text x="620" y="${y - 12}" text-anchor="end" font-size="11" fill="${MU}" font-family="JetBrains Mono">${v} / ${t} ${u}</text>`; }).join('');
  return sec('diet', '营养', days.length ? `近 ${days.length} 天均值` : '饮食记录未接入', `<div class="row"><div class="cell s7">${svg('0 0 620 150', '营养摄入与目标', ch)}</div><div class="cell s5"><span class="note">${days.length ? `TDEE 反推 ${d.diet.tdeeEst ?? '—'} kcal（生理预估 ${d.diet.tdeeExpected ?? '—'}）。` : '记录饮食后，这里显示每日摄入 vs 目标、三大宏量完成度，以及用摄入和体重趋势反推的真实 TDEE（预估 ' + (d.diet.tdeeExpected ?? 2400) + '）。'}</span></div></div>`);
}

// ---------------- boot ----------------
// data.json (your own, git-ignored) first; data.sample.json (synthetic demo athlete) as the fallback.
async function loadData() {
  for (const f of ['data.json', 'data.sample.json']) {
    const res = await fetch(f, { cache: 'no-store' }).catch(() => null);
    if (res && res.ok) { const d = await res.json(); d._demo = f !== 'data.json'; return d; }
  }
  return null;
}
function render(d) {
  if (d.macro?.name) document.title = d.macro.name;
  document.getElementById('app').innerHTML = (d._demo ? `<div class="note" style="border:1px solid ${LINE};padding:10px 14px">Demo · 虚构运动员的示例数据（data.sample.json）。运行 npm run data 生成你自己的 data.json。</div>` : '') + header(d) + overview(d) + macro(d) + races(d) + running(d) + strength(d) + recovery(d) + physio(d) + rehab(d) + diet(d) +
    `<footer style="display:flex;justify-content:space-between;padding-top:16px;border-top:1px solid ${LINE}"><span class="cap" style="color:${DIM}">Coach Paddy</span><span class="cap" style="color:${DIM}">Obsidian · Garmin · 训记 · 生成于 ${md(d.generatedAt.slice(0, 10))}</span></footer>`;
  // highlight the section in view
  const links = [...document.querySelectorAll('#nav a')];
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) links.forEach((a) => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)); }), { rootMargin: '-45% 0px -50% 0px' });
  document.querySelectorAll('section[id]').forEach((s) => io.observe(s));
}

// Optional front-end gate (deters casual visitors, NOT real security): only when the data carries a passcode
// (DASHBOARD_PASSCODE in .env.local when you run npm run data). The demo data has none.
let DATA = null;
function open() { document.getElementById('gate').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); render(DATA); }
function unlock() {
  if (document.getElementById('pass').value === DATA.passcode) {
    try { localStorage.setItem('paddy_auth', '1'); } catch (e) {}
    open();
  } else { const p = document.getElementById('pass'); p.value = ''; p.placeholder = '口令错误'; }
}
document.getElementById('enter').addEventListener('click', unlock);
document.getElementById('pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
loadData().then((d) => {
  if (!d) { document.getElementById('gate').classList.remove('hidden'); document.getElementById('gate').innerHTML = '<p class="note">没有 data.json，也没有 data.sample.json。先运行 npm run sample 或 npm run data。</p>'; return; }
  DATA = d;
  let authed = false; try { authed = localStorage.getItem('paddy_auth') === '1'; } catch (e) {}
  if (!d.passcode || authed) open(); else document.getElementById('gate').classList.remove('hidden');
});
</script>
